name: Deploy to Odoo.sh repo

on:
  pull_request:
    types: [labeled, synchronize]
  push:
    tags:
      - "*"

jobs:
  deploy-staging:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'to-staging')
    runs-on: ubuntu-latest
    steps:
      - name: Check required workflows passed
        run: |
          STATUS=$(curl -s -H "Authorization: token ${{secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/status")
          STATE=$(echo "$STATUS" | jq -r .state)
          if [ "$STATE" != "success" ]; then
            echo "Required checks not passing (state: $STATE). Aborting deploy."
            exit 1
          fi

      - name: Dispatch staging event
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DISPATCH_AUTOMATION_TOKEN }}
          repository: "Impress-Foods/sh-19"
          event-type: "trigger_staging_build"
          client-payload: |
            {
              "repo": "${{ github.repository }}",
              "sha": "${{ github.sha }}",
              "target_branch": "staging"
            }

  deploy-production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production event
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DISPATCH_AUTOMATION_TOKEN }}
          repository: "Impress-Foods/sh-19"
          event-type: "trigger_production_build"
          client-payload: |
            {
              "repo": "${{ github.repository }}",
              "sha": "${{ github.sha }}",
              "target_branch": "production"
            }
