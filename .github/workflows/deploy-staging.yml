name: Deploy staging

on:
  pull_request:
    types: [labeled, synchronize]
    branches: ["19.0*"]

jobs:
  deploy-staging:
    if: contains(github.event.pull_request.labels.*.name, 'to-staging')
    runs-on: ubuntu-latest
    steps:
      - name: Verify tests and pre-commit passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          SHA="${{ github.event.pull_request.head.sha }}"
          MAX_RETRIES=20
          RETRY=0

          while [ $RETRY -lt $MAX_RETRIES ]; do
            ALL_PASSED=true
            for wf in tests pre-commit; do
              CONCLUSION=$(gh api "/repos/$REPO/actions/runs?head_sha=$SHA&event=pull_request" \
                --jq "[.workflow_runs[] | select(.name == \"$wf\") | .conclusion] | first // \"missing\"")

              case "$CONCLUSION" in
                success) echo "$wf: passed" ;;
                missing) echo "$wf: not started yet"; ALL_PASSED=false ;;
                queued|in_progress) echo "$wf: $CONCLUSION"; ALL_PASSED=false ;;
                failure|cancelled|timed_out|action_required)
                  echo "$wf: $CONCLUSION. Aborting."
                  exit 1
                  ;;
                *) echo "$wf: $CONCLUSION"; ALL_PASSED=false ;;
              esac
            done

            if [ "$ALL_PASSED" = true ]; then
              echo "All checks passed. Deploying staging."
              exit 0
            fi

            RETRY=$((RETRY + 1))
            echo "Waiting for checks... (attempt $RETRY/$MAX_RETRIES)"
            sleep 30
          done

          echo "Timed out waiting for checks to complete."
          exit 1

      - name: Dispatch staging event
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DISPATCH_AUTOMATION_TOKEN }}
          repository: "Impress-Foods/impressfoods19"
          event-type: "trigger_staging_build"
          client-payload: |
            {
              "repo": "${{ github.repository }}",
              "sha": "${{ github.event.pull_request.head.sha }}",
              "ref_name": "${{ github.ref_name }}",
              "target_branch": "staging"
            }
