name: make pot files

on:
  push:
    branches:
      - "NONE"
jobs:
  update-pot-files:
    runs-on: ubuntu-22.04
    container: ghcr.io/impress-foods/odoo-ci/py3.10-odoo17.0:latest
    name: make_pot
    strategy:
      fail-fast: false
    services:
      postgres:
        image: postgres:12.0
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install addons and dependencies
        run: oca_install_addons
      - name: Initialize test db
        run: oca_init_test_database
      - name: Update .pot files
        run:
          oca_export_and_push_pot https://x-access-token:${{
          secrets.GIT_PUSH_TOKEN}}@github.com/${{ github.repository }}
