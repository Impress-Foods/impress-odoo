<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" preserveAspectRatio="none"
    width="100%" height="100%">
    <!-- 50% {transform: scale(1, 1.15);} -->

    <style type="text/css" id="style1">
        @keyframes wave {
        0%, 100% {transform: scale(1, 1);}
        50% {transform: scale(1, 2);}
        }

        g {
        transform-origin: center top;

        animation: wave 2s cubic-bezier(.445, .05, .55, .95) infinite;
        }

        path {
        transform-origin: center;
        }
    </style>
    <!-- preserveAspectRatio="xMinYMin meet"-->
    <!-- fill="#7C6576" -->
    <defs>
        <svg id="waves_top" preserveAspectRatio="xMinYMin meet" viewBox="0 0 1400 30" fill="#3AADAA" width="100%"
            class="dynamic-wave">
            <path style="stroke-width:0.745941" class="st0"
                d="M0 27 19.5 24.3C39 21.7 78 16.3 116.8 14.8 155.7 13.3 194.3 15.7 233.2 18.3 272 21 311 24 350 21.8 389 19.7 428 12.3 466.8 13 505.7 13.7 544.3 22.3 583.2 25 622 27.7 661 24.3 700 21.7 739 19 778 17 816.8 17.8 855.7 18.7 894.3 22.3 933.2 21.2 972 20 1011 14 1050 13 1089 12 1128 16 1166.8 18.3 1205.7 20.7 1244.3 21.3 1283.2 20.8 1322 20.3 1361 18.7 1380.5 17.8L1400 17 1400 0 0 0Z"
                id="path1" />
        </svg>
        <svg id="waves_bottom" preserveAspectRatio="xMinYMax meet" viewBox="0 0 1400 30" fill="#7C6576" width="100%">
            <path style="stroke-width:0.745941" class="st0"
                d="M0 30H19.5L116.8 30 233.2 30 350 30 466.8 30 583.2 30 700 30 816.8 30 933.2 30 1050 30 1166.8 30 1283.2 30 1380.5 30H1400V10L1380.5 9.2C1361 8.3 1322 6.7 1283.2 6.2 1244.3 5.7 1205.7 6.3 1166.8 8.7 1128 11 1089 15 1050 14S972 7 933.2 5.8C894.3 4.7 855.7 8.3 816.8 9.2 778 10 739 8 700 5.3 661 2.7 622-.7 583.2 2 544.3 4.7 505.7 13.3 466.8 14 428 14.7 389 7.3 350 5.2 311 3 272 6 233.2 8.7 194.3 11.3 155.7 13.7 116.8 12.2 78 10.7 39 5.3 19.5 2.7L0 0Z"
                id="path2" />
        </svg>
    </defs>
    <svg>
        <use xlink:href="#waves_top" />
        <use xlink:href="#waves_bottom" />
    </svg>
</svg>